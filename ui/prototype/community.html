<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>校捷通 - 社区中心</title>
<!-- Tailwind CSS (本地) -->
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<!-- Iconify图标 -->
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .phone-container {
            width: 375px;
            height: 812px;
            background-color: white;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #111827;
        }
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
        }
        .scrollable-content::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
<div class="phone-container">
<!-- 1. 顶部状态栏（与首页一致） -->
<div class="flex justify-between items-center px-8 pt-4 pb-2 text-sm font-semibold select-none">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<iconify-icon class="text-lg" icon="heroicons:signal-20-solid"></iconify-icon>
<iconify-icon class="text-lg" icon="heroicons:wifi-20-solid"></iconify-icon>
<iconify-icon class="text-xl rotate-90" icon="heroicons:battery-50-20-solid"></iconify-icon>
</div>
</div>
<!-- 2. 标题区 -->
<div class="flex justify-between items-center px-6 py-4">
<div class="flex items-center space-x-3">
<a href="home.html">
<iconify-icon class="text-2xl text-gray-800" icon="heroicons:arrow-left-20-solid"></iconify-icon>
</a>
<div>
<h1 class="text-2xl font-bold text-gray-900">社区中心</h1>
<p class="text-xs text-gray-400 -mt-0.5">社区=论坛+二手交易</p>
</div>
</div>
<a class="text-blue-500 text-sm font-medium" href="publish_entry.html">发布</a>
</div>
<!-- 3. 中间内容区域 -->
<div class="scrollable-content px-6">
<!-- 核心功能模块 -->
<div class="space-y-4 mt-2">
<!-- 卡片1：二手交易 -->
<div class="flex items-center bg-white rounded-2xl px-5 py-5 shadow-sm border border-gray-50">
<div class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0" style="background-color:#22C55E;">
<iconify-icon class="text-white text-2xl" icon="heroicons:shopping-bag"></iconify-icon>
</div>
<div class="ml-4 flex-1">
<h3 class="text-base font-bold text-gray-900">二手交易</h3>
<p class="text-xs text-gray-400 mt-0.5">闲置发布、估价、购买、我的订单</p>
</div>
<a class="text-white text-sm font-medium px-4 py-2 rounded-lg flex-shrink-0" href="secondhand_list.html" style="background-color:#22C55E;">进入</a>
</div>
<!-- 卡片2：校园论坛 -->
<div class="flex items-center bg-white rounded-2xl px-5 py-5 shadow-sm border border-gray-50">
<div class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0" style="background-color:#22C55E;">
<iconify-icon class="text-white text-2xl" icon="heroicons:chat-bubble-left-right"></iconify-icon>
</div>
<div class="ml-4 flex-1">
<h3 class="text-base font-bold text-gray-900">校园论坛</h3>
<p class="text-xs text-gray-400 mt-0.5">发帖、回复、热榜、推送消息</p>
</div>
<a class="text-white text-sm font-medium px-4 py-2 rounded-lg flex-shrink-0" href="forum_new.html" style="background-color:#22C55E;">进入</a>
</div>
</div>
<!-- 快捷发布区 -->
<div class="mt-8">
<div class="flex justify-between items-center mb-4">
<h2 class="text-lg font-bold text-gray-900">快捷发布</h2>
<a class="text-blue-500 text-sm font-medium" href="publish_entry.html">场景化</a>
</div>
<div class="space-y-3">
<!-- 发布二手商品 -->
<div class="flex items-center bg-white rounded-2xl px-5 py-4 shadow-sm border border-gray-50">
<div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background-color:#22C55E;">
<iconify-icon class="text-white text-xl" icon="heroicons:shopping-bag"></iconify-icon>
</div>
<div class="ml-3 flex-1">
<h4 class="text-sm font-bold text-gray-900">教材、数码、生活用品</h4>
<p class="text-xs text-gray-400 mt-0.5">自动生成标题和建议价</p>
</div>
<button class="text-white text-xs font-medium px-3 py-1.5 rounded-lg flex-shrink-0" style="background-color:#22C55E;">发布</button>
</div>
<!-- 发布论坛帖子 -->
<div class="flex items-center bg-white rounded-2xl px-5 py-4 shadow-sm border border-gray-50">
<div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background-color:#22C55E;">
<iconify-icon class="text-white text-xl" icon="heroicons:chat-bubble-left-right"></iconify-icon>
</div>
<div class="ml-3 flex-1">
<h4 class="text-sm font-bold text-gray-900">学习交流、互助求助、活动招募</h4>
<p class="text-xs text-gray-400 mt-0.5">选择板块后发布</p>
</div>
<button class="text-white text-xs font-medium px-3 py-1.5 rounded-lg flex-shrink-0" style="background-color:#22C55E;">发帖</button>
</div>
</div>
</div>
<!-- 底部留白 -->
<div class="mt-12 text-center">
<p class="text-gray-300 text-xs italic">—— 更多社区功能即将上线 ——</p>
</div>
</div>
<!-- 4. 底部导航栏（社区高亮选中） -->
<div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 pt-3 pb-8 flex justify-between items-center">
<a class="flex flex-col items-center text-gray-400" href="home.html">
<iconify-icon class="text-2xl" icon="heroicons:home"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">首页</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="ai.html">
<iconify-icon class="text-2xl" icon="heroicons:chat-bubble-left-right"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">AI</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="services.html">
<iconify-icon class="text-2xl" icon="heroicons:squares-2x2"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">服务</span>
</a>
<a class="flex flex-col items-center text-blue-500" href="community.html">
<iconify-icon class="text-2xl" icon="heroicons:user-group-solid"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">社区</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="profile.html">
<iconify-icon class="text-2xl" icon="heroicons:user"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">我的</span>
</a>
</div>
</div>
</body>
</html>
