<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>校捷通 - 发布二手</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
    body {
        background-color: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .phone-container {
        width: 375px;
        height: 812px;
        background-color: white;
        border-radius: 40px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 8px solid #111827;
    }
    .scrollable-content {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 80px;
    }
    .scrollable-content::-webkit-scrollbar {
        display: none;
    }
</style>
</head>
<body>
<div class="phone-container">
<!-- 顶部状态栏 -->
<div class="flex justify-between items-center px-8 pt-4 pb-2 text-sm font-semibold select-none">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<iconify-icon class="text-lg" icon="heroicons:signal-20-solid"></iconify-icon>
<iconify-icon class="text-lg" icon="heroicons:wifi-20-solid"></iconify-icon>
<iconify-icon class="text-xl rotate-90" icon="heroicons:battery-50-20-solid"></iconify-icon>
</div>
</div>
<!-- 标题区 -->
<div class="flex justify-between items-center px-6 py-4">
<div class="flex items-center space-x-3">
<a href="community.html"><iconify-icon class="text-2xl text-gray-800" icon="heroicons:arrow-left-20-solid"></iconify-icon></a>
<h1 class="text-xl font-bold text-gray-900">发布二手</h1>
</div>
<span class="text-blue-500 text-sm font-medium">草稿</span>
</div>
<div class="scrollable-content px-6">
<!-- AI辅助模块 -->
<div class="bg-white rounded-2xl border border-gray-100 p-4 flex items-center space-x-4 mb-6 shadow-sm">
<div class="w-12 h-12 bg-purple-500 rounded-full flex items-center justify-center flex-shrink-0">
<iconify-icon class="text-2xl text-white" icon="heroicons:sparkles-20-solid"></iconify-icon>
</div>
<div>
<p class="text-base font-semibold text-gray-900">AI辅助发布</p>
<p class="text-xs text-gray-400 mt-0.5">识别图片，生成标题/描述/建议价</p>
</div>
</div>
<!-- 商品信息 -->
<h2 class="text-base font-bold text-gray-900 mb-3">商品信息</h2>
<div class="space-y-3 mb-6">
<div class="flex items-center justify-between bg-white border border-gray-100 rounded-xl px-4 py-3">
<span class="text-sm text-gray-500">类别</span>
<span class="text-sm font-medium text-gray-900">教材教辅</span>
</div>
<div class="flex items-center justify-between bg-white border border-gray-100 rounded-xl px-4 py-3">
<span class="text-sm text-gray-500">标题</span>
<span class="text-sm font-medium text-gray-900">高等数学上下册同济版</span>
</div>
<div class="flex items-center justify-between bg-white border border-gray-100 rounded-xl px-4 py-3">
<span class="text-sm text-gray-500">建议价</span>
<span class="text-sm font-medium text-gray-900">¥25-¥35</span>
</div>
<div class="flex items-center justify-between bg-white border border-gray-100 rounded-xl px-4 py-3">
<span class="text-sm text-gray-500">交易</span>
<span class="text-sm font-medium text-gray-900">校内自提</span>
</div>
</div>
<!-- 商品图片 -->
<h2 class="text-base font-bold text-gray-900 mb-3">商品图片</h2>
<div class="grid grid-cols-4 gap-3 mb-8">
<div class="aspect-square bg-gray-50 border border-gray-200 rounded-xl flex items-center justify-center">
<iconify-icon class="text-3xl text-green-500" icon="heroicons:photo-20-solid"></iconify-icon>
</div>
<div class="aspect-square bg-gray-50 border border-gray-200 rounded-xl flex items-center justify-center">
<iconify-icon class="text-3xl text-green-500" icon="heroicons:photo-20-solid"></iconify-icon>
</div>
<div class="aspect-square bg-gray-50 border border-gray-200 rounded-xl flex items-center justify-center">
<iconify-icon class="text-3xl text-green-500" icon="heroicons:photo-20-solid"></iconify-icon>
</div>
<div class="aspect-square bg-gray-50 border border-gray-200 rounded-xl flex items-center justify-center">
<iconify-icon class="text-3xl text-gray-400" icon="heroicons:lock-closed-20-solid"></iconify-icon>
</div>
</div>
<!-- 发布按钮 -->
<div class="flex justify-center pb-6">
<button class="bg-green-500 text-white font-semibold text-base px-20 py-3 rounded-xl shadow-sm">发布</button>
</div>
</div>
<!-- 底部导航栏 -->
<div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 pt-3 pb-8 flex justify-between items-center">
<a class="flex flex-col items-center text-gray-400" href="home.html">
<iconify-icon class="text-2xl" icon="heroicons:home-solid"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">首页</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="ai.html">
<iconify-icon class="text-2xl" icon="heroicons:chat-bubble-left-right"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">AI</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="services.html">
<iconify-icon class="text-2xl" icon="heroicons:squares-2x2"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">服务</span>
</a>
<a class="flex flex-col items-center text-blue-500" href="community.html">
<iconify-icon class="text-2xl" icon="heroicons:user-group"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">社区</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="profile.html">
<iconify-icon class="text-2xl" icon="heroicons:user"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">我的</span>
</a>
</div>
</div>
</body>
</html>
