<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>校捷通 - 服务中心</title>
<!-- Tailwind CSS (本地) -->
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<!-- Iconify图标 -->
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .phone-container {
            width: 375px;
            height: 812px;
            background-color: white;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #111827;
        }
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
        }
        .scrollable-content::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
<div class="phone-container">
<!-- 1. 顶部状态栏 -->
<div class="flex justify-between items-center px-8 pt-4 pb-2 text-sm font-semibold select-none">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<iconify-icon class="text-lg" icon="heroicons:signal-20-solid"></iconify-icon>
<iconify-icon class="text-lg" icon="heroicons:wifi-20-solid"></iconify-icon>
<iconify-icon class="text-xl rotate-90" icon="heroicons:battery-50-20-solid"></iconify-icon>
</div>
</div>
<!-- 2. 标题区 -->
<div class="flex justify-between items-center px-6 py-4">
<div class="flex items-center space-x-3">
<a href="home.html">
<iconify-icon class="text-2xl text-gray-800" icon="heroicons:arrow-left-20-solid"></iconify-icon>
</a>
<h1 class="text-2xl font-bold text-gray-900">服务中心</h1>
</div>
<a class="text-blue-500" href="#">
<iconify-icon class="text-2xl" icon="heroicons:magnifying-glass-20-solid"></iconify-icon>
</a>
</div>
<!-- 3. 中间内容区域 -->
<div class="scrollable-content px-6">
<!-- 搜索栏 -->
<div class="bg-gray-100 rounded-xl flex items-center px-4 py-3 mb-6 mt-2">
<iconify-icon class="text-gray-400 text-lg mr-2" icon="heroicons:magnifying-glass-20-solid"></iconify-icon>
<span class="text-gray-400 text-sm">搜索服务、通知、地图、教室</span>
</div>
<!-- 服务网格 3列 -->
<div class="grid grid-cols-3 gap-4">
<!-- 1. 课表 -->
<a class="flex flex-col items-center bg-white rounded-2xl py-5 px-2 shadow-sm border border-gray-50 hover:shadow-md transition-shadow cursor-pointer" href="#">
<div class="w-12 h-12 rounded-full flex items-center justify-center mb-2" style="background-color:#3B82F6;">
<iconify-icon class="text-white text-xl" icon="heroicons:calendar-days"></iconify-icon>
</div>
<span class="text-sm font-medium text-gray-800">课表</span>
</a>
<!-- 2. 绩点 -->
<a class="flex flex-col items-center bg-white rounded-2xl py-5 px-2 shadow-sm border border-gray-50 hover:shadow-md transition-shadow cursor-pointer" href="#">
<div class="w-12 h-12 rounded-full flex items-center justify-center mb-2" style="background-color:#3B82F6;">
<iconify-icon class="text-white text-xl" icon="heroicons:chart-bar"></iconify-icon>
</div>
<span class="text-sm font-medium text-gray-800">绩点</span>
</a>
<!-- 3. 空教室查询 -->
<a class="flex flex-col items-center bg-white rounded-2xl py-5 px-2 shadow-sm border border-gray-50 hover:shadow-md transition-shadow cursor-pointer" href="#">
<div class="w-12 h-12 rounded-full flex items-center justify-center mb-2" style="background-color:#3B82F6;">
<iconify-icon class="text-white text-xl" icon="heroicons:building-library"></iconify-icon>
</div>
<span class="text-sm font-medium text-gray-800">空教室查询</span>
</a>
<!-- 4. 校园地图 -->
<a class="flex flex-col items-center bg-white rounded-2xl py-5 px-2 shadow-sm border border-gray-50 hover:shadow-md transition-shadow cursor-pointer" href="map.html">
<div class="w-12 h-12 rounded-full flex items-center justify-center mb-2" style="background-color:#3B82F6;">
<iconify-icon class="text-white text-xl" icon="heroicons:map"></iconify-icon>
</div>
<span class="text-sm font-medium text-gray-800">校园地图</span>
</a>
<!-- 5. 图书馆预约 -->
<a class="flex flex-col items-center bg-white rounded-2xl py-5 px-2 shadow-sm border border-gray-50 hover:shadow-md transition-shadow cursor-pointer" href="#">
<div class="w-12 h-12 rounded-full flex items-center justify-center mb-2" style="background-color:#3B82F6;">
<iconify-icon class="text-white text-xl" icon="heroicons:book-open"></iconify-icon>
</div>
<span class="text-sm font-medium text-gray-800">图书馆预约</span>
</a>
<!-- 6. 校园卡 -->
<a class="flex flex-col items-center bg-white rounded-2xl py-5 px-2 shadow-sm border border-gray-50 hover:shadow-md transition-shadow cursor-pointer" href="#">
<div class="w-12 h-12 rounded-full flex items-center justify-center mb-2" style="background-color:#F97316;">
<iconify-icon class="text-white text-xl" icon="heroicons:credit-card"></iconify-icon>
</div>
<span class="text-sm font-medium text-gray-800">校园卡</span>
</a>
<!-- 7. 互助 -->
<a class="flex flex-col items-center bg-white rounded-2xl py-5 px-2 shadow-sm border border-gray-50 hover:shadow-md transition-shadow cursor-pointer" href="#">
<div class="w-12 h-12 rounded-full flex items-center justify-center mb-2" style="background-color:#22C55E;">
<iconify-icon class="text-white text-xl" icon="heroicons:hand-raised"></iconify-icon>
</div>
<span class="text-sm font-medium text-gray-800">互助</span>
</a>
<!-- 8. 校园通知 -->
<a class="flex flex-col items-center bg-white rounded-2xl py-5 px-2 shadow-sm border border-gray-50 hover:shadow-md transition-shadow cursor-pointer" href="notifications.html">
<div class="w-12 h-12 rounded-full flex items-center justify-center mb-2" style="background-color:#EF4444;">
<iconify-icon class="text-white text-xl" icon="heroicons:bell"></iconify-icon>
</div>
<span class="text-sm font-medium text-gray-800">校园通知</span>
</a>
</div>
<!-- 底部留白提示 -->
<div class="mt-12 text-center">
<p class="text-gray-300 text-xs italic">—— 更多服务即将上线 ——</p>
</div>
</div>
<!-- 4. 底部导航栏（服务高亮选中） -->
<div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 pt-3 pb-8 flex justify-between items-center">
<a class="flex flex-col items-center text-gray-400" href="home.html">
<iconify-icon class="text-2xl" icon="heroicons:home"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">首页</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="ai.html">
<iconify-icon class="text-2xl" icon="heroicons:chat-bubble-left-right"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">AI</span>
</a>
<a class="flex flex-col items-center text-blue-500" href="services.html">
<iconify-icon class="text-2xl" icon="heroicons:squares-2x2-solid"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">服务</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="community.html">
<iconify-icon class="text-2xl" icon="heroicons:user-group"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">社区</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="profile.html">
<iconify-icon class="text-2xl" icon="heroicons:user"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">我的</span>
</a>
</div>
</div>
</body>
</html>
