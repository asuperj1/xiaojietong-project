<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>校捷通 - 通知中心</title>
<script src="vendor/tailwindcss.js"></script>
<script src="vendor/iconify-icon.min.js"></script>
<style>
    body {
        background-color: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .phone-container {
        width: 375px;
        height: 812px;
        background-color: white;
        border-radius: 40px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 8px solid #111827;
    }
    .scrollable-content {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 80px;
    }
    .scrollable-content::-webkit-scrollbar {
        display: none;
    }
</style>
</head>
<body>
<div class="phone-container">
<!-- 顶部状态栏 -->
<div class="flex justify-between items-center px-8 pt-4 pb-2 text-sm font-semibold select-none">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<iconify-icon class="text-lg" icon="heroicons:signal-20-solid"></iconify-icon>
<iconify-icon class="text-lg" icon="heroicons:wifi-20-solid"></iconify-icon>
<iconify-icon class="text-xl rotate-90" icon="heroicons:battery-50-20-solid"></iconify-icon>
</div>
</div>
<!-- 标题区 -->
<div class="flex justify-between items-center px-6 py-4">
<div class="flex items-center space-x-3">
<a href="services.html"><iconify-icon class="text-2xl text-gray-800" icon="heroicons:arrow-left-20-solid"></iconify-icon></a>
<h1 class="text-xl font-bold text-gray-900">通知中心</h1>
</div>
<span class="text-blue-500 text-sm font-medium">全部已读</span>
</div>
<!-- 标签 -->
<div class="px-6 mb-4 flex space-x-3">
<span class="bg-blue-100 text-blue-500 text-sm font-medium px-4 py-1.5 rounded-full">全部</span>
<span class="bg-white text-gray-700 text-sm font-medium px-4 py-1.5 rounded-full border border-gray-200">置顶</span>
<span class="bg-blue-100 text-blue-500 text-sm font-medium px-4 py-1.5 rounded-full">未读</span>
<span class="bg-white text-gray-700 text-sm font-medium px-4 py-1.5 rounded-full border border-gray-200">待办</span>
</div>
<div class="scrollable-content px-6">
<!-- 重要未读板块 -->
<div class="flex justify-between items-center mb-4">
<h2 class="text-base font-bold text-gray-900">重要未读</h2>
<span class="text-xs text-gray-400">2条</span>
</div>
<div class="space-y-4">
<!-- 通知卡片1 -->
<div class="bg-white rounded-2xl border border-gray-100 p-4 shadow-sm">
<div class="flex items-start space-x-3">
<div class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center flex-shrink-0">
<iconify-icon class="text-xl text-red-500" icon="heroicons:bell-alert-20-solid"></iconify-icon>
</div>
<div class="flex-1">
<div class="flex items-center space-x-2 mb-1">
<span class="bg-red-100 text-red-500 text-[10px] font-medium px-2 py-0.5 rounded">未读</span>
<span class="text-[10px] text-gray-400">置顶通知</span>
</div>
<p class="text-sm font-semibold text-gray-900">期末考试安排更新</p>
<p class="text-xs text-gray-400 mt-1">教务处·建议今天处理</p>
<div class="mt-3">
<span class="bg-blue-500 text-white text-xs font-medium px-4 py-1.5 rounded-lg">查看</span>
</div>
</div>
</div>
</div>
<!-- 通知卡片2 -->
<div class="bg-white rounded-2xl border border-gray-100 p-4 shadow-sm">
<div class="flex items-start space-x-3">
<div class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center flex-shrink-0">
<iconify-icon class="text-xl text-red-500" icon="heroicons:bell-alert-20-solid"></iconify-icon>
</div>
<div class="flex-1">
<div class="flex items-center space-x-2 mb-1">
<span class="bg-red-100 text-red-500 text-[10px] font-medium px-2 py-0.5 rounded">未读</span>
<span class="text-[10px] text-gray-400">系统通知</span>
</div>
<p class="text-sm font-semibold text-gray-900">图书馆座位预约提醒</p>
<p class="text-xs text-gray-400 mt-1">图书馆·距离开始30分钟</p>
<div class="mt-3">
<span class="bg-blue-500 text-white text-xs font-medium px-4 py-1.5 rounded-lg">查看</span>
</div>
</div>
</div>
</div>
</div>
<div class="h-6"></div>
</div>
<!-- 底部导航栏 -->
<div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 pt-3 pb-8 flex justify-between items-center">
<a class="flex flex-col items-center text-gray-400" href="home.html">
<iconify-icon class="text-2xl" icon="heroicons:home-solid"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">首页</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="ai.html">
<iconify-icon class="text-2xl" icon="heroicons:chat-bubble-left-right"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">AI</span>
</a>
<a class="flex flex-col items-center text-blue-500" href="services.html">
<iconify-icon class="text-2xl" icon="heroicons:squares-2x2"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">服务</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="community.html">
<iconify-icon class="text-2xl" icon="heroicons:user-group"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">社区</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="profile.html">
<iconify-icon class="text-2xl" icon="heroicons:user"></iconify-icon>
<span class="text-[10px] mt-1 font-medium">我的</span>
</a>
</div>
</div>
</body>
</html>
